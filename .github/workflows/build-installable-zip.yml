name: Build installable plugin ZIPs (Free + Pro)

# Free and Pro live in separate repositories:
#   Free: Vertex-Systems-Network/shipping-cost-monitor-for-woocommerce
#   Pro:  Vertex-Systems-Network/shipping-cost-monitor-pro-for-woocommerce
# This workflow is the same in both (only the push `paths:` list differs). A first job
# pins one commit of each repository (the other repository's same-named branch if it
# exists, else main); every later job checks out exactly those commits, Free into free/
# and Pro into pro/. It checks the Free/Pro contract,
# lints both on every supported PHP version and, only when all of that passes, builds
# and uploads BOTH installable ZIPs.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'assets/**'
      - 'includes/**'
      - 'composer.json'
      - 'shipping-cost-monitor-pro-for-woocommerce.php'
      - 'uninstall.php'
      - 'changelog.txt'
      - 'LICENSE'

permissions:
  contents: read

env:
  FREE_REPO: Vertex-Systems-Network/shipping-cost-monitor-for-woocommerce
  PRO_REPO: Vertex-Systems-Network/shipping-cost-monitor-pro-for-woocommerce

jobs:
  resolve:
    name: Resolve the Free and Pro commits to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      free_sha: ${{ steps.refs.outputs.free_sha }}
      pro_sha: ${{ steps.refs.outputs.pro_sha }}
      self_path: ${{ steps.refs.outputs.self_path }}
    steps:
      - name: Pin both repositories to one commit each
        id: refs
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CROSS_TOKEN: ${{ secrets.SCM_CROSS_REPO_TOKEN }}
          SELF_SHA: ${{ github.sha }}  # on pull requests, the merge commit with the target branch
        run: |
          set -euo pipefail
          # Resolved once here; every later job checks out exactly these commits, so the
          # ZIPs always contain the code that passed the checks.
          if [ "$GITHUB_REPOSITORY" = "$FREE_REPO" ]; then other="$PRO_REPO"; self_path=free; else other="$FREE_REPO"; self_path=pro; fi
          # A private repository needs the cross-repository token to be read.
          if [ -n "${CROSS_TOKEN:-}" ]; then base="https://x-access-token:${CROSS_TOKEN}@github.com"; else base="https://github.com"; fi
          if ! git ls-remote "${base}/${other}.git" HEAD >/dev/null 2>&1; then
            echo "::error::Cannot read ${other}. If it is private, add a read-only token for both repositories as the SCM_CROSS_REPO_TOKEN secret in ${GITHUB_REPOSITORY}."; exit 1
          fi
          # The other repository's same-named branch if exactly refs/heads/$BRANCH exists, else main.
          line="$(git ls-remote "${base}/${other}.git" "refs/heads/${BRANCH}" | awk -v r="refs/heads/${BRANCH}" '$2==r')"
          if [ -n "$line" ]; then other_ref="$BRANCH"; other_sha="${line%%[[:space:]]*}"; else other_ref=main; other_sha="$(git ls-remote "${base}/${other}.git" refs/heads/main | cut -f1)"; fi
          [ -n "$other_sha" ] || { echo "::error::Could not resolve ${other}@${other_ref}"; exit 1; }
          if [ "$self_path" = free ]; then free_sha="$SELF_SHA"; pro_sha="$other_sha"; else pro_sha="$SELF_SHA"; free_sha="$other_sha"; fi
          { echo "free_sha=$free_sha"; echo "pro_sha=$pro_sha"; echo "self_path=$self_path"; } >> "$GITHUB_OUTPUT"
          echo "Free ${free_sha} | Pro ${pro_sha} (other repository: ${other}@${other_ref})"

  check:
    name: Contract check and PHP ${{ matrix.php }} lint
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out Free (pinned commit)
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.FREE_REPO }}
          ref: ${{ needs.resolve.outputs.free_sha }}
          path: free
          token: ${{ secrets.SCM_CROSS_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out Pro (pinned commit)
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.PRO_REPO }}
          ref: ${{ needs.resolve.outputs.pro_sha }}
          path: pro
          # The Pro repository is private: the free repository reads it with the
          # SCM_CROSS_REPO_TOKEN secret (read-only access to both repositories).
          token: ${{ secrets.SCM_CROSS_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer autoloaders
        run: |
          composer install --working-dir=free --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
          composer install --working-dir=pro --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Free/Pro contract (hooks, constants, script handle, JS globals, Requires Plugins)
        run: bash "${{ needs.resolve.outputs.self_path }}/.github/scripts/check-contract.sh" free pro

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find free/shipping-cost-monitor-for-woocommerce.php free/includes free/vendor pro/shipping-cost-monitor-pro-for-woocommerce.php pro/includes pro/vendor -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Verify Composer PSR-4 autoload
        run: |
          php -r 'define("ABSPATH", __DIR__ . "/"); require "free/vendor/autoload.php"; require "pro/vendor/autoload.php"; foreach (array("WPEssential\\ShippingCostMonitor\\Plugin", "WPEssential\\ShippingCostMonitorPro\\Plugin", "WPEssential\\ShippingCostMonitorPro\\Admin\\InvoiceImporter") as $c) { if (!class_exists($c)) { fwrite(STDERR, "PSR-4 autoload smoke failed: $c\n"); exit(1); } } echo "PSR-4 autoload smoke passed\n";' | tee /tmp/smoke.txt
          grep -q "PSR-4 autoload smoke passed" /tmp/smoke.txt

  build:
    name: Build and upload Free and Pro ZIPs
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Free (pinned commit)
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.FREE_REPO }}
          ref: ${{ needs.resolve.outputs.free_sha }}
          path: free
          token: ${{ secrets.SCM_CROSS_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out Pro (pinned commit)
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ env.PRO_REPO }}
          ref: ${{ needs.resolve.outputs.pro_sha }}
          path: pro
          # The Pro repository is private: the free repository reads it with the
          # SCM_CROSS_REPO_TOKEN secret (read-only access to both repositories).
          token: ${{ secrets.SCM_CROSS_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer autoloaders
        run: |
          composer install --working-dir=free --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
          composer install --working-dir=pro --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Check versions match
        shell: bash
        run: |
          set -euo pipefail
          free_version="$(sed -n 's/^ \* Version: *//p' free/shipping-cost-monitor-for-woocommerce.php)"
          stable_tag="$(sed -n 's/^Stable tag: *//p' free/readme.txt)"
          free_constant="$(sed -n "s/^define( 'WPE_SCM_VERSION', '\(.*\)' );/\1/p" free/shipping-cost-monitor-for-woocommerce.php)"
          pro_version="$(sed -n 's/^ \* Version: *//p' pro/shipping-cost-monitor-pro-for-woocommerce.php)"
          pro_constant="$(sed -n "s/^define( 'WPE_SCM_PRO_VERSION', '\(.*\)' );/\1/p" pro/shipping-cost-monitor-pro-for-woocommerce.php)"
          echo "Free $free_version (constant $free_constant, readme $stable_tag); Pro $pro_version (constant $pro_constant)"
          if [ -z "$free_version" ] || [ "$free_version" != "$stable_tag" ] || [ "$free_version" != "$free_constant" ]; then
            echo "Free plugin Version, WPE_SCM_VERSION and readme Stable tag must match" >&2; exit 1
          fi
          if [ -z "$pro_version" ] || [ "$pro_version" != "$pro_constant" ]; then
            echo "Pro plugin Version and WPE_SCM_PRO_VERSION must match" >&2; exit 1
          fi

      - name: Check Free contains no Pro code
        shell: bash
        run: |
          set -euo pipefail
          if [ -e free/pro ]; then echo "The free repository must not contain a pro/ folder" >&2; exit 1; fi
          if grep -rlE --exclude-dir=docs 'ShippingCostMonitorPro|wpe_scm_shipstation|wpe_scm_commit_invoice_rows|api\.shipstation\.com' free/shipping-cost-monitor-for-woocommerce.php free/includes free/assets; then
            echo "Pro code found in the Free plugin files above" >&2; exit 1
          fi

      - name: Package both plugins
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # pack SLUG SRC OUT REQUIRED... -- OPTIONAL...
          pack() {
            local slug="$1" src="$2" out="$3"; shift 3
            local dir="$out/$slug" optional=0 f
            rm -rf "$out"; mkdir -p "$dir"
            for f in "$@"; do
              if [ "$f" = "--" ]; then optional=1; continue; fi
              if [ -e "$src/$f" ]; then cp -R "$src/$f" "$dir/"
              elif [ "$optional" = 0 ]; then echo "::error::Required file $src/$f is missing"; return 1; fi
            done
            git -C "$src" rev-parse HEAD > "$dir/BUILD-ID.txt"
            (cd "$dir" && find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
            (cd "$out" && zip -qr "../$slug.zip" "$slug") && unzip -tq "$slug.zip"
          }
          pack shipping-cost-monitor-for-woocommerce free build-free assets includes vendor shipping-cost-monitor-for-woocommerce.php uninstall.php readme.txt changelog.txt LICENSE composer.json -- languages
          pack shipping-cost-monitor-pro-for-woocommerce pro build-pro assets includes vendor shipping-cost-monitor-pro-for-woocommerce.php uninstall.php changelog.txt LICENSE composer.json
          free_sha="$(git -C free rev-parse --short=12 HEAD)"; pro_sha="$(git -C pro rev-parse --short=12 HEAD)"
          echo "free_name=shipping-cost-monitor-for-woocommerce-${free_sha}" >> "$GITHUB_OUTPUT"
          echo "pro_name=shipping-cost-monitor-pro-for-woocommerce-${pro_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "### Installable ZIPs"
            echo "Built together: Free \`${free_sha}\` and Pro \`${pro_sha}\`. Upload each downloaded artifact directly in WordPress (Plugins → Add New → Upload Plugin); each already contains its plugin folder. Install Free first: Pro requires it. The Pro ZIP is uploaded only by runs in the Pro repository."
            echo ""
            dirs="build-free/shipping-cost-monitor-for-woocommerce"
            # The Pro ZIP is uploaded only from the Pro repository (F-12), so only list its hash there.
            if [ "$GITHUB_REPOSITORY" = "$PRO_REPO" ]; then dirs="$dirs build-pro/shipping-cost-monitor-pro-for-woocommerce"; fi
            for d in $dirs; do
              echo "- \`$(basename "$d")/SHA256SUMS\` lists every packaged file (check with \`sha256sum -c SHA256SUMS\` inside the folder). Manifest SHA-256: \`$(sha256sum "$d/SHA256SUMS" | cut -d' ' -f1)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Free ZIP
        uses: actions/upload-artifact@v7.0.1
        with:
          # GitHub wraps every artifact in a ZIP. Uploading the folder that holds the plugin
          # folder makes that ZIP the installable plugin ZIP.
          name: ${{ steps.package.outputs.free_name }}
          path: build-free/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Pro ZIP
        # The paid add-on is uploaded only from the (private) Pro repository, never from
        # the public free repository, where anyone could download it (F-12).
        if: github.repository == env.PRO_REPO
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.pro_name }}
          path: build-pro/
          if-no-files-found: error
          retention-days: 90
